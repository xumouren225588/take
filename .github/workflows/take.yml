name: Extract PDF Page Images

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'PDF文件的下载链接'
        required: true
        type: string
      page_number:
        description: '需要提取的页码 (从0开始计算，例如第1页请输入0)'
        required: true
        type: string

jobs:
  extract-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install PyMuPDF requests

      - name: Run extraction script
        env:
          PDF_URL: ${{ github.event.inputs.pdf_url }}
          PAGE_NUMBER: ${{ github.event.inputs.page_number }}
        run: |
          mkdir output
          python scripts/extract_image.py

      # 修改点：使用通配符匹配所有提取出的图片
      - name: Upload image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extracted-pdf-images
          path: output/*
          if-no-files-found: error
